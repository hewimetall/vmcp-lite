[package]
name = "vmcp-lite"
version = "0.1.0"
edition = "2021"
description = "PyO3 GraphQL core placeholder for vmcp-lite"
license = "MIT"
publish = false

[lib]
name = "_graphql"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29" }

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
